<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BotClient</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
    <header id="topbar">
        <button id="backBtn" class="icon-btn" type="button" aria-label="戻る" hidden>‹</button>
        <div id="title">BotClient</div>
        <button id="logoutBtn" class="text-btn" type="button" hidden>ログアウト</button>
    </header>

    <main id="screens">
        <section id="loginScreen" class="screen">
            <div class="login-card">
                <div class="logo" aria-hidden="true">B</div>
                <h1>BotClient</h1>
                <p class="sub">Bot トークンでログイン</p>
                <label for="tokenInput">Bot トークン</label>
                <input id="tokenInput" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Bot トークンを入力">
                <button id="loginBtn" class="primary" type="button">ログイン</button>
                <div id="loginError" class="error" hidden></div>
                <p class="note">トークンは保存されません（メモリ上のみ）。</p>
            </div>
        </section>

        <section id="guildScreen" class="screen" hidden>
            <ul id="guildList" class="list"></ul>
            <p id="guildEmpty" class="empty" hidden>参加しているサーバーがありません。</p>
        </section>

        <section id="channelScreen" class="screen" hidden>
            <ul id="channelList" class="list"></ul>
            <p id="channelEmpty" class="empty" hidden>テキストチャンネルがありません。</p>
        </section>

        <section id="chatScreen" class="screen chat" hidden>
            <div id="messages" class="messages"></div>
            <div id="composer" class="composer">
                <div class="modes" role="tablist">
                    <button class="mode active" data-mode="normal" type="button" role="tab">通常</button>
                    <button class="mode" data-mode="embed" type="button" role="tab">Embed</button>
                    <button class="mode" data-mode="cv2" type="button" role="tab">Components V2</button>
                </div>
                <div id="normalPane" class="pane">
                    <textarea id="contentInput" rows="1" placeholder="メッセージを送信" enterkeyhint="send"></textarea>
                </div>
                <div id="embedPane" class="pane" hidden>
                    <input id="embedTitle" placeholder="タイトル">
                    <textarea id="embedDesc" rows="2" placeholder="説明"></textarea>
                    <input id="embedColor" placeholder="色 (例 #5865F2)">
                </div>
                <div id="cv2Pane" class="pane" hidden>
                    <textarea id="cv2Text" rows="2" placeholder="Text Display の内容"></textarea>
                </div>
                <button id="sendBtn" class="primary" type="button">送信</button>
                <div id="sendError" class="error" hidden></div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
